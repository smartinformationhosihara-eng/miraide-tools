<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Placeholders: replace all three with the film's own palette and display face. */
      :root {
        --ground: #000;
        --ink: #ffffff;
        --font-display: sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="4" data-track-index="0">MIRAIDE LIVE</h1><p id="sub" class="clip" data-start="0" data-duration="4" data-track-index="1" style="color:#ff6fb5;font-size:48px;position:absolute;top:640px">ステージ、開演</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title",{opacity:0,y:80,scale:0.8},{opacity:1,y:0,scale:1,duration:0.8,ease:"back.out(2)"},0.2);tl.fromTo("#sub",{opacity:0,letterSpacing:"1em"},{opacity:1,letterSpacing:"0.1em",duration:1,ease:"power3.out"},1.0);tl.to("#title",{color:"#ffd84d",duration:0.5},2.5);
      // Example: tl.fromTo("#title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
